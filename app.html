<title>수시 면접 준비실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#F3F5F2; --paper:#FFFFFF; --ink:#1B2622; --ink-2:#4A5852; --line:#D9DFDA; --line-2:#E8ECE9;
  --accent:#1E6B57; --accent-soft:#E2EFEA; --accent-ink:#FFFFFF;
  --mine:#B4432A; --mine-soft:#F8E6E1; --warn:#9A6A0B; --warn-soft:#F7EED8; --ok:#2F7A45; --ok-soft:#E3F1E6;
  --bubble-me:#E2EFEA; --bubble-them:#FFFFFF;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-disp:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#121816; --paper:#1A2220; --ink:#E6ECE8; --ink-2:#A3B1AA; --line:#2E3A36; --line-2:#24302C;
  --accent:#5DBA9C; --accent-soft:#1F3530; --accent-ink:#0E1614;
  --mine:#EE8A70; --mine-soft:#3A2420; --warn:#E3B55A; --warn-soft:#352C18; --ok:#7CCB92; --ok-soft:#1E3325;
  --bubble-me:#1F3530; --bubble-them:#1F2926;
}}
:root[data-theme="dark"]{
  --ground:#121816; --paper:#1A2220; --ink:#E6ECE8; --ink-2:#A3B1AA; --line:#2E3A36; --line-2:#24302C;
  --accent:#5DBA9C; --accent-soft:#1F3530; --accent-ink:#0E1614;
  --mine:#EE8A70; --mine-soft:#3A2420; --warn:#E3B55A; --warn-soft:#352C18; --ok:#7CCB92; --ok-soft:#1E3325;
  --bubble-me:#1F3530; --bubble-them:#1F2926;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.65 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-bottom:18px}
h1{font:800 26px/1.2 var(--f-disp);margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px}
.store{font-size:12px;color:var(--ink-2)}
.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font:700 17px/1.3 var(--f-disp);margin:0}
.label{font-size:11px;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px;font-size:14px}
button:hover{border-color:var(--ink-2)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--mine)}
button:disabled{opacity:.5;cursor:default}
/* 현황표 */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.06em;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--line-2)}
tbody tr.sel{background:var(--accent-soft)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line-2);font:500 12px var(--f-mono)}
.rank.hot{background:var(--mine);color:var(--paper)}
.name{font-weight:600}
.muted{color:var(--ink-2);font-size:12.5px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.red{background:var(--mine-soft);color:var(--mine)}
.chip.amber{background:var(--warn-soft);color:var(--warn)}
.chip.gray{background:var(--line-2);color:var(--ink-2)}
.chip.green{background:var(--ok-soft);color:var(--ok)}
.chip.ex{background:var(--line-2);color:var(--ink-2);font-weight:500;margin-left:4px}
.legend{padding:10px 16px;font-size:12px;color:var(--ink-2)}
/* 상세 */
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:12px 10px;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.body{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:600}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.6}
.hint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.status{font-size:13px;color:var(--ink-2)}
.status.err{color:var(--mine)}
.note{border:1px solid var(--line);background:var(--ground);border-radius:8px;padding:10px 12px;font-size:13.5px}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
/* 질문지 */
.sheet h3{font:700 18px/1.35 var(--f-disp);margin:26px 0 10px;text-wrap:balance}
.sheet h3:first-child{margin-top:0}
.narr{font:700 17px/1.6 var(--f-disp);padding:12px 0 12px 14px;border-left:3px solid var(--accent);margin:0}
.mine-tbl td:first-child{min-width:180px}
.mine-tbl .ev{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.mine-tbl ol{margin:0;padding-left:18px}
.qa{border-top:1px solid var(--line-2);padding:16px 0}
.qa .q{font-weight:600;font-size:15.5px;display:flex;gap:10px;line-height:1.5}
.qa .qn{font:500 13px var(--f-mono);color:var(--accent);padding-top:2px;flex:none;width:30px}
.qa dl{margin:10px 0 0 40px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:14px;background:var(--ground);border-radius:8px;padding:12px 14px}
.qa dt{color:var(--ink-2);font-size:12px;font-weight:600;padding-top:2px;white-space:nowrap}
.qa dd{margin:0;max-width:64ch;line-height:1.7}
.quote{font-style:normal;color:var(--ink-2)}
.quote::before{content:"“"}.quote::after{content:"”"}
.src{font-size:11.5px;color:var(--accent);font-weight:600;margin-left:4px;white-space:nowrap}
.kw{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:0 7px;margin:0 4px 2px 0;font-size:13px}
.tails{margin:0;padding-left:18px}
.checks label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:14.5px}
.checks input{width:auto}
@media (max-width:560px){.qa dl{margin-left:0;grid-template-columns:1fr}.qa dt{padding-top:6px}}
/* 모의면접 */
.chat{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:86%;padding:10px 13px;border-radius:12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--bubble-them);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--bubble-me)}
.msg.fb{align-self:stretch;max-width:none;background:var(--warn-soft);border:1px solid var(--warn)}
.meta{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.flags{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.timer{font:500 13px var(--f-mono)}
.timer.over{color:var(--mine)}
.empty{padding:28px 18px;color:var(--ink-2);text-align:center}
mark{background:var(--mine-soft);color:var(--mine);border-radius:3px;padding:0 2px}
.result li{margin-bottom:4px}
/* 학년별 학생부 */
.sec-h{font:700 17px/1.3 var(--f-disp);margin:0}
.year{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0}
.year.y3{border:2px solid var(--accent)}
.year legend{font:700 15px var(--f-disp);padding:0 6px}
details.year > summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;list-style:none;padding:2px 0}
details.year > summary::-webkit-details-marker{display:none}
details.year > summary::before{content:"▸";color:var(--ink-2);font-size:12px}
details.year[open] > summary::before{content:"▾"}
.year-t{font:700 17px/1.3 var(--f-disp)}
.area{padding-top:12px;margin-top:12px;border-top:1px solid var(--line-2);display:grid;gap:8px}
.area-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.area-k{font-size:12.5px;font-weight:600;color:var(--accent)}
.items{display:grid;gap:12px}
.item{display:grid;gap:2px}
.item-k{font:600 14.5px/1.4 var(--f-body);margin:0}
.item-b{font-size:14.5px;line-height:1.8;max-width:64ch}
.item-b p{margin:0 0 6px}
.item-b.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--accent);padding:0;font-size:13px;justify-self:start;text-decoration:underline}
.tiny{padding:2px 7px;font-size:12px}
.raw{margin-top:8px}
.raw > summary{cursor:pointer;font-size:13px;color:var(--accent)}
.raw-pre{max-height:320px;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-all;user-select:text}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
/* 진로 */
.career{background:var(--accent-soft);border-radius:10px;padding:14px 18px;margin:14px 16px 0;display:grid;gap:6px}
.career.empty-career{background:var(--ground);border:1px dashed var(--line)}
.career-title{font:800 24px/1.3 var(--f-disp);text-wrap:balance}
.basis{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.basis b{display:inline-block;min-width:52px;color:var(--accent);font-weight:600}
.career-mini{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px}
.src.y3{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:4px}
.dist{font-size:13px;color:var(--ink-2);margin:0 0 4px}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

    <section class="panel" id="detail" aria-live="polite"></section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

const BLIND = [

  {label:"부모·친인척 직업", re:/(아버지|어머니|아빠|엄마|부모님|할아버지|할머니|삼촌|이모|고모|외삼촌|큰아버지|누나|언니|오빠)[^.!?\n]{0,20}(의사|변호사|판사|검사|교수|교사|공무원|간호사|약사|사업|대표|사장|회사|근무|일하|직업|연구원|기자|군인|경찰)/g},
  {label:"공인 어학 성적", re:/(TOEIC|토익|TEPS|텝스|TOEFL|토플|IELTS|아이엘츠|HSK|JLPT|JPT|DELF|OPIc|오픽)/gi},
  {label:"교외 수상", re:/(교외|외부|전국|국제|올림피아드)[^.!?\n]{0,15}(수상|입상|상을|금상|은상|동상|대상)/g},
  {label:"논문·학회", re:/(논문|학회|학술지|KCI|SCI|등재)/gi},
  {label:"해외 활동", re:/(해외|어학연수|유학|교환학생)/g},
  {label:"자격증", re:/(자격증|기능사|컴활|정보처리기)/g},
];
function blindCheck(text){
  const out = [];
  for (const r of BLIND){ for (const m of (text||"").matchAll(r.re)) out.push({label:r.label, match:m[0], index:m.index}); }
  return out.sort((a,b)=>a.index-b.index);
}

const timers = {}, chains = {};
function save(s){
  s.dirty = true; s.updatedAt = Date.now();

  timers[s.id] = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(s));

      .then(() => col.doc(s.id).set(body))
      .catch(e => { $("#store").textContent = e?.code === "quota_exceeded" ? "저장 공간이 가득 찼습니다. 끝난 학생을 삭제해 주세요." : "저장 실패 — 잠시 후 다시 수정하면 재시도합니다."; });

function dday(date){
  if (!date) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(date + "T00:00:00") - t) / 86400000);
}
const mineCount = s => s.sheet?.mines?.length ?? null;
function ranked(){
  const act = students.filter(s => dday(s.date) != null && dday(s.date) >= 0);
  act.sort((a,b) => dday(a.date) - dday(b.date) || (mineCount(b)??-1) - (mineCount(a)??-1));
  const r = new Map(); act.forEach((s,i) => r.set(s.id, i+1)); return r;
}
function ddayChip(date){
  const d = dday(date);
  if (d == null) return h("span",{class:"chip gray",text:"미정"});
  if (d < 0) return h("span",{class:"chip gray",text:"종료"});
  const cls = d <= 7 ? "red" : d <= 21 ? "amber" : "gray";
  return h("span",{class:"chip "+cls,text: d === 0 ? "D-DAY" : "D-"+d});
}

const REC = [["setuk","세특","교과 세부능력 및 특기사항"],["chang","창체","창의적 체험활동(자율·동아리·진로)"],["haeng","행발","행동특성 및 종합의견"]];
const REC_TITLE = Object.fromEntries(REC.map(([k,,t]) => [k,t]));
const GR_LABEL = {"3":"3학년","2":"2학년","1":"1학년","0":"학년 미상"};
const emptyRec = () => Object.fromEntries(["1","2","3","0"].map(g => [g,{setuk:"",chang:"",haeng:""}]));
const recGet = (s,g,k) => (s.rec?.[g]?.[k] || "").trim();
const hasGrade = (s,g) => REC.some(([k]) => recGet(s,g,k));

// sample 입력 64KiB 제한 → 3학년 > 2학년 > 학년 미상 > 1학년 순으로 분량을 배정(학년 안에선 행발 > 창체 > 세특), 출력은 학년 순서
function recordPlan(s, budget, only){
  const segs = [];
  for (const g of (only ? [only] : ["1","2","3","0"])) for (const [k] of REC){ const t = recGet(s,g,k); if (t) segs.push({g,k,t}); }
  const gp = {"3":0,"2":1,"0":2,"1":3}, kp = {haeng:0,chang:1,setuk:2};
  let left = budget;
  for (const sg of [...segs].sort((a,b) => (gp[a.g]*3+kp[a.k]) - (gp[b.g]*3+kp[b.k]))){ sg.cut = sg.t.slice(0, Math.max(left,0)); left -= sg.cut.length; }
  return segs;
}
function recordText(s, budget = 16000, only){
  let out = "", last = null;
  for (const sg of recordPlan(s, budget, only)){
    if (!sg.cut) continue;
    if (sg.g !== last){ out += `\n===== ${GR_LABEL[sg.g]}${sg.g === "3" ? " (가장 중요)" : ""} =====\n`; last = sg.g; }
    out += `■ ${REC_TITLE[sg.k]}\n${sg.cut}${sg.cut.length < sg.t.length ? "\n(분량 제한으로 이하 생략)" : ""}\n\n`;
  }
  return out.trim();
}

async function pdfText(buf){
  await loadScript(CDN+"pdf.js/3.11.174/pdf.worker.min.js");   // 전역 pdfjsWorker → 메인 스레드에서 실행
  await loadScript(CDN+"pdf.js/3.11.174/pdf.min.js");
  const pdf = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
  let out = "";
  for (let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    let prevEnd = null, prevY = null;
    for (const it of tc.items){
      if (typeof it.str !== "string" || !it.transform) continue;
      const x = it.transform[4], y = it.transform[5];
      if (prevY !== null && Math.abs(y - prevY) > 2) out += "\n";        // 줄이 바뀌었다
      else if (prevEnd !== null && x - prevEnd > 1.2) out += " ";        // 사이가 벌어졌다 = 진짜 띄어쓰기
      out += it.str;
      prevEnd = x + (it.width || 0); prevY = y;
      if (it.hasEOL){ out += "\n"; prevEnd = prevY = null; }
    }
    out += "\n";
  }
  return out;
}
async function hwpxText(buf){
  await loadScript(CDN+"jszip/3.10.1/jszip.min.js");
  const zip = await JSZip.loadAsync(buf);
  const names = Object.keys(zip.files).filter(n => /^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  let out = "";
  for (const n of names){
    const doc = new DOMParser().parseFromString(await zip.file(n).async("string"), "application/xml");
    let lastP = null;
    for (const t of doc.getElementsByTagNameNS("*","t")){
      let p = t.parentNode; while (p && p.localName !== "p") p = p.parentNode;
      if (p !== lastP && lastP) out += "\n";
      out += t.textContent; lastP = p;
    }
    out += "\n";
  }
  return out;
}
async function inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function hwpText(buf){
  await loadScript(CDN+"xlsx/0.18.5/xlsx.full.min.js");       // XLSX.CFB로 HWP(OLE) 컨테이너를 연다
  const cfb = XLSX.CFB.read(new Uint8Array(buf), {type:"array"});
  const entry = name => { const i = cfb.FullPaths.findIndex(p => p.endsWith(name)); return i < 0 ? null : new Uint8Array(cfb.FileIndex[i].content); };
  const header = entry("/FileHeader");
  if (!header) throw new Error("HWP 파일 형식이 아닙니다.");
  const flags = new DataView(header.buffer, header.byteOffset).getUint32(36, true);
  if (flags & 2) throw new Error("암호가 걸린 HWP입니다. 암호를 풀고 저장하거나 PDF로 저장해 주세요.");
  const secs = cfb.FullPaths.map((p,i)=>[p,i]).filter(([p]) => /BodyText\/Section\d+$/.test(p))
    .sort((a,b)=>+a[0].match(/\d+$/)[0] - +b[0].match(/\d+$/)[0]);
  let out = "";
  for (const [,i] of secs){
    let d = new Uint8Array(cfb.FileIndex[i].content);
    if (flags & 1) d = await inflateRaw(d);
    const v = new DataView(d.buffer, d.byteOffset, d.byteLength);
    for (let o = 0; o + 4 <= d.length;){
      const hd = v.getUint32(o, true); o += 4;
      const tag = hd & 0x3FF; let size = hd >>> 20;
      if (size === 0xFFF){ size = v.getUint32(o, true); o += 4; }
      if (tag === 67){                                          // HWPTAG_PARA_TEXT
        for (let j = o; j + 1 < o + size;){
          const c = v.getUint16(j, true);
          if (c === 10 || c === 13){ out += "\n"; j += 2; }
          else if (c === 9){ out += "\t"; j += 16; }
          else if (c < 32){ j += (c <= 23 && ![0,10,13].includes(c)) ? 16 : 2; }   // 인라인·확장 컨트롤은 8글자 폭
          else { out += String.fromCharCode(c); j += 2; }
        }
        out += "\n";
      }
      o += size;
    }
  }
  return out;
}
async function xlsText(buf){
  await loadScript(CDN+"xlsx/0.18.5/xlsx.full.min.js");
  const wb = XLSX.read(buf, {type:"array"});
  return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, blankrows:false})
    .map(r => r.filter(c => c !== "" && c != null).join(" ")).join("\n")).join("\n");
}

/* 나이스 학생부 → 학년 × (세특·창체·행발)
   섹션 제목("6. 창의적 체험활동상황" 등)으로 구간을 나누고, 구간 안에서 "[3학년]" 또는 표 첫 칸의 학년 숫자로 학년을 바꾼다. */
const loose = s => new RegExp("^[\\dⅠ-Ⅹ.\\s]*" + s.split("").join("[\\s·ㆍ]*"));
const SECTIONS = [
  ["chang","창의적체험활동상황"],["gyo","교과학습발달상황"],["haeng","행동특성및종합의견"],
  ["skip","인적학적사항"],["skip","학적사항"],["skip","출결상황"],["skip","수상경력"],["skip","자격증및인증취득상황"],
  ["skip","학교폭력조치상황"],["skip","봉사활동실적"],["skip","독서활동상황"],["skip","진로희망사항"],
].map(([k,p]) => [k, loose(p)]);
const HEADER_WORDS = /^(학\s*년|학\s*기|교\s*과|과\s*목|영\s*역|시\s*간|특\s*기\s*사\s*항|세\s*부\s*능\s*력|이\s*수\s*학\s*점|성\s*취\s*도|원\s*점\s*수|석\s*차|비\s*고|구\s*분)/;
const LABEL = /^((?:자율[·ㆍ\s]*자치|자율|동아리|진로|봉사|안전)\s*활동|\([^)]{1,20}\)|[가-힣A-Za-zⅠ-Ⅹ·&\s]{1,16}\s*[:：])/;

// "화 법 과 작 문"처럼 글자마다 떨어져 나온 줄을 되붙인다
function unspace(l){
  const fix = c => {
    const t = c.split(" ").filter(Boolean);
    if (t.length < 6) return c;
    const head = /^[123]$/.test(t[0]) ? t.shift() : "";          // 표 첫 칸의 학년 숫자는 살린다
    const body = t.filter(w => w.length === 1).length / t.length > 0.7 ? t.join("") : t.join(" ");
    return (head ? head + " " : "") + body;
  };
  return l.split(/\s{2,}/).filter(Boolean).map(fix).join(" ");   // 넓게 벌어진 자리는 진짜 띄어쓰기
}
// 성적표·과목 구분 표의 머리글 조각
const NOISE = /(표준편차|수강자수|석차등급|성취도|이수단위|이수학점|원점수|과목평균|분포비율|진로\s*선택\s*과목|공통\s*과목|일반\s*선택|융합\s*선택|체육\s*[·ㆍ]\s*예술)/;
// 성적표 한 줄: 등급 글자(A~E·P)가 홀로 있거나, 원점수/과목평균 꼴이거나, 교과명이 빗금으로 이어진다
const GRADE_ROW = /(^|\s)[A-EP](\s|$)|\d+\s*\/\s*\d+\s*\(|[가-힣]+\/[가-힣]+\//;

// 줄바꿈으로 잘린 문장을 다시 잇는다(문장 끝이 아니고 다음 줄이 새 항목 표시가 아니면)
function mergeWrapped(arr){
  const out = [];
  for (const l of arr){
    const prev = out.at(-1);
    if (prev != null && !/[.!?)\]]$/.test(prev) && !LABEL.test(l)) out[out.length-1] = prev + " " + l;
    else out.push(l);
  }
  return out.join("\n");
}

function splitRecord(raw){
  const lines = raw.replace(/\r/g,"").split("\n").map(l => unspace(l.replace(/[\t ]/g," ").trim()).replace(/ +/g," ").trim()).filter(Boolean);
  const freq = {}; for (const l of lines) freq[l] = (freq[l]||0) + 1;
  const buf = {}, all = [];
  let sec = null, g = "0", hits = 0;
  for (let l of lines){
    if (l.length >= 6 && freq[l] >= 3 && /\d/.test(l)) continue;        // 매 쪽 머리글(날짜·반·번호·성명)
    if (/^\d+\s*\/\s*\d+$/.test(l)) continue;                         // 쪽 번호
    if (l.length < 30){
      const hit = SECTIONS.find(([,re]) => re.test(l));
      if (hit){ sec = hit[0]; g = "0"; if (sec !== "skip") hits++; continue; }
    }
    if (l.length < 80 && !/[.!?]$/.test(l) && NOISE.test(l)) continue;      // 성적표 머리글 조각
    if (sec === "gyo" && !/[.!?]$/.test(l) && GRADE_ROW.test(l)) continue;  // 성적표 본문 줄(세특 문장은 마침표로 끝난다)
    let m = l.match(/^\[?\s*([123])\s*학\s*년\s*\]?(.*)$/);
    if (m && (!m[2].trim() || sec === "gyo")){ g = m[1]; l = m[2].trim(); if (!l) continue; }
    if (sec && sec !== "gyo"){                                        // 창체·행발 표: 첫 칸이 학년 숫자
      if (/^[123]$/.test(l)){ g = l; continue; }
      m = l.match(/^([123])\s+(?=[가-힣(])(.*)$/);
      if (m){ g = m[1]; l = m[2]; }
    }
    if (l.length < 40 && HEADER_WORDS.test(l)) continue;
    const ko = (l.match(/[가-힣]/g)||[]).length;
    if (ko < 2 || ko < (l.match(/\d/g)||[]).length) continue;          // 성적표 숫자 줄
    l = l.replace(/^((?:자율[·ㆍ\s]*자치|자율|동아리|진로|봉사|안전)\s*활동)\s*\d{1,3}\s*/, "$1 ");   // 창체 표의 시간 칸 제거
    all.push(l);
    if (sec && sec !== "skip") (buf[g+"|"+sec] ||= []).push(l);
  }
  const rec = emptyRec(), key = {chang:"chang", gyo:"setuk", haeng:"haeng"};
  for (const [k, arr] of Object.entries(buf)){ const [gg, sc] = k.split("|"); rec[gg][key[sc]] = mergeWrapped(arr); }
  return {rec, hits, all};
}

async function importFile(s, file){
  const setMsg = (t, err) => { impMsg[s.id] = {t, err}; const el = $("#imp-status"); if (el){ el.className = "status" + (err ? " err" : ""); el.textContent = t; } };
  setMsg(`${file.name} 읽는 중…`);
  try {
    const buf = await file.arrayBuffer();
    const ext = file.name.split(".").pop().toLowerCase();
    const raw = ext === "pdf" ? await pdfText(buf)
      : ext === "hwpx" ? await hwpxText(buf)
      : ext === "hwp" ? await hwpText(buf)
      : ["xlsx","xls"].includes(ext) ? await xlsText(buf)
      : ext === "txt" ? new TextDecoder().decode(buf)
      : (()=>{ throw new Error("PDF, HWP, HWPX, XLSX, XLS, TXT 파일만 불러올 수 있습니다."); })();
    rawKeep[s.id] = raw;
    s.raw = raw.slice(0, 120000);              // 걸러내기 전 원문 — 화면에서 확인하고 필요하면 직접 옮겨 쓴다                                  // 분리가 이상할 때 확인용 — 저장하지 않고 이 화면에서만 들고 있다
    if ((raw.match(/[가-힣]/g)||[]).length < 50) throw new Error("글자를 찾지 못했습니다. 스캔한 이미지 PDF라면 나이스에서 다시 저장해 주세요.");
    const r = splitRecord(raw);
    s.example = false; editRec = false;
    if (!r.hits){
      s.rec = emptyRec(); s.rec["0"].setuk = mergeWrapped(r.all);
      save(s); render();
      setMsg("학생부 항목 제목을 찾지 못해 전체를 '학년 미상'에 넣었습니다. '직접 고치기'에서 학년·항목별로 옮겨 주세요.", true);
      return;
    }
    s.rec = r.rec; save(s); render();
    const n = (g,k) => recGet(s,g,k).length.toLocaleString();
    const parts = ["3","2","1"].filter(g => hasGrade(s,g)).map(g => `${GR_LABEL[g]} 세특 ${n(g,"setuk")}·창체 ${n(g,"chang")}·행발 ${n(g,"haeng")}자`);
    const miss = hasGrade(s,"0") ? " / 학년을 못 가린 내용이 있습니다('학년 미상' 확인)" : "";
    setMsg(`불러옴 — ${parts.join(" / ")}${miss}.` + (aiReady ? " 예상질문지를 만드는 중입니다." : ""));
    if (aiReady) generateSheet(s);
  } catch(e){
    setMsg(e?.message || "파일을 읽지 못했습니다.", true);
  }
}

/* 항목 안을 다시 활동·과목 단위로 쪼갠다: 창체는 자율/동아리/진로, 세특은 과목 이름 */
const CHANG_LBL = /^((?:자율[·ㆍ\s]*자치|자율|동아리|진로|봉사|안전)\s*활동(?:\([^)]{1,20}\))?)\s*[:：]?\s*/;
const SUBJ_LBL = /^[〈<[【《(]?([^\s:：〉>\]】》]{1,18})[〉>\]】》)]?\s*[:：]\s*/;
function parseItems(k, text){
  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
  const items = [];
  const push = (label, line) => items.push({label, body: line ? [line] : []});
  lines.forEach((l, i) => {
    let m;
    if (k === "chang" && (m = l.match(CHANG_LBL))) return push(m[1], l.slice(m[0].length));
    if (k === "setuk"){
      if ((m = l.match(SUBJ_LBL)) && /[가-힣A-Za-z]/.test(m[1])) return push(m[1], l.slice(m[0].length));
      if (l.length <= 20 && i + 1 < lines.length && /[가-힣]/.test(l) && !/[.!?…]$/.test(l)) return push(l, "");
    }
    if (!items.length) push("", l); else items.at(-1).body.push(l);
  });
  return items.map(it => ({label:it.label, body:it.body.join("\n").trim()})).filter(it => it.label || it.body);
}
function itemCard(it){
  const body = h("div",{class:"item-b"}, it.body.split("\n").filter(Boolean).map(p => h("p",{text:p})));
  const long = it.body.length > 300;
  if (long) body.classList.add("clamp");
  return h("div",{class:"item"},
    it.label && h("h4",{class:"item-k",text:it.label}),
    it.body ? body : h("span",{class:"muted",text:"내용 없음"}),
    long && h("button",{class:"more",text:"더 보기",onclick:e=>{ e.target.textContent = body.classList.toggle("clamp") ? "더 보기" : "접기"; }}));
}
const areaSummary = (k, items) => k === "setuk" ? `${items.filter(i=>i.label).length || items.length}과목`
  : k === "chang" ? [...new Set(items.map(i => i.label.replace("활동","")).filter(Boolean))].join(" · ")
  : `${items.reduce((n,i)=>n+i.body.length,0).toLocaleString()}자`;

}

function sheetPrompt(s, grade){

[이번 분석 범위] ${GR_LABEL[grade]} 기록만 본다. 이 학년 기록에서만 질문을 내고, 질문은 ${({"3":9,"2":6,"1":4,"0":4})[grade]}개 안팎으로 만든다. 이 호출에서는 mines와 sections만 채우고 career·narrative·closing·warnings는 빈 값("" 또는 [])으로 둔다.` : "";
  return `너는 고3 담임의 수시 면접 지도를 돕는 코치다. 아래 학생부만 근거로 학생의 진로를 파악하고 면접 예상질문지를 만든다.

규칙
- 학생부에 실제 기재된 내용만 근거로 삼는다. 질문마다 근거 문장을 학생부 원문 그대로 인용(evidence)하고 출처(source)를 "학년 영역-과목/활동" 형식으로 적는다(예: "3학년 세특-물리학Ⅱ", "2학년 동아리", "3학년 진로활동", "1학년 행발"). 근거를 댈 수 없는 질문은 만들지 않는다. 학생부에 없는 활동을 지어내지 않는다.
- 학년 비중: 면접관은 최근 기록을 가장 깊이 묻는다. 예상질문의 약 50%는 3학년, 약 30%는 2학년 기록에서 내고, 1학년은 20% 이하로 진로의 출발점·서사 확인에만 쓴다. 지뢰 항목도 3학년 → 2학년 순으로 먼저 찾는다. 3학년 기록이 적으면 그만큼 2학년으로 채운다. '학년 미상' 기록은 내용으로 학년을 판단한다.
- career(진로): 학생부 전체, 특히 3학년 기록을 분석해 이 학생의 진로를 딱 한 줄로 정한다. title은 구체적인 진로(예: "전력전자·에너지 시스템 엔지니어"처럼 분야+역할, 20자 안팎), field는 학문 분야(예: "전기공학"), basis는 학년별 근거 한 줄씩(학년 오름차순, 기록이 있는 학년만), fit는 지원 학과와의 연결 {"level":"높음|보통|낮음","note":"한 줄 이유"}. 학년에 따라 진로가 바뀐 흔적이 있으면 shift에 한 줄로 적고, 면접에서 그 전환을 설명할 준비가 필요하다고 warnings에도 넣는다. 없으면 shift는 "".
- narrative: 1학년→3학년 관심 심화 서사 1~2문장. 3학년에서 도달한 지점을 분명히 쓴다.
- mines(지뢰 항목): 고등학생 수준을 넘어 보이는 개념·이론·기법, 결과만 적혀 과정 설명이 어려운 탐구를 빠짐없이 찾는다. 항목마다 questions에 개념 확인 질문("면접관이 처음 듣는다고 생각하고 1분 안에 설명해 보세요" 형태), 과정 질문(어떤 자료, 어디서 막혔나), 공동 활동이면 역할 질문을 넣는다.
- sections: 예상질문 총 15~20개. 영역 배분은 지원동기·전공 적합성 25%, 학업 역량(세특 심화) 35%, 전공 관련 탐구·동아리 20%, 공동체 역량·협업 15%. area 이름은 이 네 개를 그대로 쓴다. 면접 유형이 제시문 기반이거나 인성·상황 면접이면 그 유형에 맞게 비중을 조정하고 warnings에 알린다.
- 주요 질문 5~7개(3학년 기록 위주)에만 tails(꼬리질문) 2개를 붙인다(구체화: 숫자·기간·역할 / 검증: 개념 이해 / 실패: 안 된 지점과 대응 / 확장: 대학에서 이어갈 방법). 나머지는 tails: [].
- 완성된 답변 문장은 쓰지 않는다. keywords는 학생 본인 활동에서 나온 명사 3개. skeleton은 "결론 → 근거 활동 → 배운 점·변화 → 전공 연결" 흐름을 이 학생 내용으로 짧게(화살표로 연결). 말하면 30~60초 분량을 전제로 한다.
- closing: 마지막 한마디(1분)의 뼈대. 진로(career)와 이어지게.
- 블라인드: 출신 고교명, 지역 특정 표현, 부모·친인척 직업·지위, 교외 수상, 공인 어학 성적, 논문·학회, 해외 활동, 자격증, 독서활동 상황의 도서명은 skeleton·keywords에 넣지 않는다(세특 본문에 녹아 있는 독서 내용은 가능). 학생부에 그런 요소가 있으면 warnings에 "블라인드 주의: …"로 적는다.
- 입력이 학생부 원문이 아니라 교사 메모로 보이면 warnings 첫 줄에 "학생부 원문 미확인 — 실제 기재 문구와 대조 필요"를 넣는다.

JSON 하나만 출력한다. 형식:
{"career":{"title":"...","field":"...","basis":[{"grade":"1학년","point":"..."}],"fit":{"level":"높음","note":"..."},"shift":""},"narrative":"...","warnings":["..."],"mines":[{"item":"기재 내용 요약","evidence":"원문 인용","source":"3학년 세특-...","questions":["...","..."]}],"sections":[{"area":"지원동기·전공 적합성","questions":[{"q":"...","evidence":"원문 인용","source":"3학년 ...","keywords":["","",""],"skeleton":"... → ... → ... → ...","tails":["...","..."]}]}],"closing":"..."}

${scope}

[학생 정보]
지원: ${s.univ||"미입력"} ${s.dept||""} / 전형: ${s.track||"미입력"} / 면접 유형: ${s.itype||"서류 기반 확인 면접"} / 면접일: ${s.date||"미정"}

[학생부 — 학년별]
${recordText(s, grade ? 17000 : 16000, grade)}`;
}

/* ───────── AI 없이 만드는 질문지(규칙 기반) ─────────
   학생부 문장을 그대로 근거로 삼아 정해진 틀에 끼워 질문을 만든다.
   판단은 없으므로 지뢰 항목·진로는 표현으로만 추린다. */
const AREA_SHORT = {setuk:"세특", chang:"창체", haeng:"행발"};
const sentences = t => String(t||"").split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(x => x.length > 12);
const short = (t, n=40) => t.length > n ? t.slice(0,n).replace(/[\s,·]+$/,"") + "…" : t;
const TERM = /[A-Z][A-Za-z0-9]{2,}(?:-[A-Za-z0-9]+)?|[가-힣A-Za-z]{2,12}(?:[·-][가-힣A-Za-z]{2,12})?\s*(?:법칙|방정식|모델|이론|기법|공식|효과|가설|메커니즘|기작|알고리즘|상수|계수|회로|구조|지수|제어|소자)/g;
const KW_STOP = /^(그리고|하지만|그래서|그러나|통해|대해|위해|이를|다양|자신|활동|내용|과정|모습|자료|결과|경험|생각|수업|시간|친구|모둠|학생|발표|이해|관심|바탕|중심|특히|매우|스스로|사회|우리|여러|중요|필요|사용|활용|주제|문제|방법|토대|모두|가장|다시|직접|실제|점검|보완|태도|역량|능력|참여|노력|수행|조사|작성|정리|보고서|발표|탐구|프로젝트|캠페인|기사|동아리|진로|학년|선생|교내|보고)/;
function keywords(sent){
  const ws = sent.replace(/[^가-힣A-Za-z0-9\s·-]/g," ").split(/\s+/)
    .map(w => w.replace(/(으로서|에서는|에게서|이라는|라는|에서|에게|으로|하며|하고|하여|을|를|이|가|은|는|에|와|과|의|도|만|까지|부터|한|할|함|적|들)$/,""))
    .map(w => w.length >= 3 ? w.replace(/(해|하|되|된|며)$/,"") : w)
    .filter(w => w.length >= 2 && !/d/.test(w) && !/적$/.test(w) && !KW_STOP.test(w));
  return [...new Set(ws)].sort((a,b) => b.length - a.length).slice(0,3);
}
const TAILS = [
  "그 활동은 얼마 동안 했고, 본인이 직접 맡은 부분은 어디인가요?",
  "방금 말한 개념을 면접관이 처음 듣는다고 생각하고 한 문장으로 정의해 보세요.",
  "계획대로 되지 않은 부분은 무엇이었고, 어떻게 대응했나요?",
  "대학에 와서 이 경험을 어떻게 이어 가고 싶은가요?",
];

function rulesSheet(s){
  const dept = s.dept || "지원 학과";
  const pool = [], seen = new Set();
  for (const g of ["3","2","1","0"]) for (const [k] of REC)
    for (const it of parseItems(k, recGet(s,g,k)))
      for (const sent of sentences(it.body)){
        if (seen.has(sent)) continue;
        seen.add(sent);
        pool.push({g, k, label: it.label || "", sent, area: (it.label||"").replace("활동","")});
      }
  if (!pool.length) return null;
  const gw = {"3":0,"2":1,"0":2,"1":3};
  const rank = (a,b) => gw[a.g] - gw[b.g] || b.sent.length - a.sent.length;
  const src = p => `${GR_LABEL[p.g]} ${AREA_SHORT[p.k]}${p.label ? "-" + p.label : ""}`;
  const pick = (f, n) => pool.filter(f).sort(rank).slice(0, n);
  const isJinro = p => p.k === "chang" && /진로/.test(p.label);
  const isDong  = p => p.k === "chang" && /동아리/.test(p.label);

  // 지뢰 항목: 전문 용어처럼 보이는 표현이 든 문장
  const mines = [];
  for (const p of [...pool].sort(rank)){
    const terms = [...new Set((p.sent.match(TERM)||[]).map(t => t.trim())
      .filter(t => t.length >= 3 && !/(을|를|이|가|은|는|에|의|도)s/.test(t)))];   // 조사가 낀 건 용어가 아니다
    if (!terms.length || mines.length >= 6) continue;
    if (mines.some(m => m.item === terms[0])) continue;
    mines.push({item:terms[0], evidence:p.sent, source:src(p), ready:"미확인",
      questions:[
        `${terms[0]}가(이) 무엇인지 면접관이 처음 듣는다고 생각하고 1분 안에 설명해 보세요.`,
        "그 내용을 알아보려고 어떤 자료를 봤고, 어디서 막혔나요?",
        ...(p.k === "chang" ? ["공동 활동이었다면 본인이 실제로 맡은 부분은 무엇인가요?"] : [])
      ]});
  }

  let tailN = 0;
  const Q = (q, p, extra={}) => ({
    q, evidence:p.sent, source:src(p), keywords:keywords(p.sent),
    skeleton:`결론 한 문장 → ${keywords(p.sent)[0] || "해당 활동"} 경험 → 배운 점·달라진 점 → ${dept} 연결`,
    tails: extra.tails ?? (tailN < 6 ? (tailN++, [TAILS[tailN % 4], TAILS[(tailN+2) % 4]]) : []),
  });

  const jinro = pick(isJinro, 4), setuk = pick(p => p.k === "setuk", 7);
  const dong = pick(isDong, 4), gong = pick(p => p.k === "haeng" || (p.k === "chang" && /자율/.test(p.label)), 3);
  const sections = [
    {area:"지원동기·전공 적합성", questions:[
      jinro[0] && Q(`${dept}에 지원하게 된 계기를 말해 보세요.`, jinro[0]),
      jinro[1] && Q(`진로활동에 적힌 이 활동이 ${dept} 지원으로 이어진 과정을 설명해 보세요.`, jinro[1]),
      jinro[2] && Q("고등학교 3년 동안 관심이 어떻게 깊어졌는지 순서대로 말해 보세요.", jinro[2]),
      (jinro[3] || setuk[0]) && Q(`${dept}에 와서 가장 먼저 공부하고 싶은 것은 무엇인가요?`, jinro[3] || setuk[0]),
    ].filter(Boolean)},
    {area:"학업 역량(세특 심화)", questions: setuk.map((p,i) => Q(
      [`${p.label || "이 과목"} 시간에 한 이 활동에 어떻게 접근했고, 무엇을 알게 되었나요?`,
       "이 탐구에서 가장 어려웠던 부분은 무엇이었나요?",
       "이 내용을 친구에게 설명한다면 어떻게 설명하겠습니까?",
       "여기서 더 알아보고 싶어진 것은 무엇인가요?"][i % 4], p))},
    {area:"전공 관련 탐구·동아리", questions: dong.map((p,i) => Q(
      [`동아리에서 한 이 활동에서 본인이 맡은 역할은 무엇이었나요?`,
       "이 활동의 결과를 어떻게 확인했나요?",
       "함께한 친구들과 의견이 갈린 적이 있나요?",
       "이 활동이 진로를 정하는 데 어떤 영향을 주었나요?"][i % 4], p))},
    {area:"공동체 역량·협업", questions: gong.map((p,i) => Q(
      ["여기에 적힌 모습이 드러난 구체적인 상황을 하나 말해 보세요.",
       "그때 어떤 어려움이 있었고 어떻게 풀었나요?",
       "함께한 친구들은 본인을 어떤 사람으로 볼 것 같나요?"][i % 3], p, {tails:[]}))},
  ].filter(x => x.questions.length);

  // 진로: 3학년 표현에 가중치를 두고 자주 나온 낱말을 모은다(판단이 아니라 빈도)
  const freq = {};
  for (const p of pool) if (p.k === "chang" && !/자율/.test(p.label)) for (const w of keywords(p.sent)) freq[w] = (freq[w]||0) + (p.g === "3" ? 2 : 1);
  const top = Object.entries(freq).filter(x => x[1] >= 2).sort((a,b) => b[1]-a[1]).slice(0,3).map(x => x[0]);
  const firstOf = g => pool.filter(p => p.g === g && p.k !== "haeng").sort(rank)[0];
  const basis = ["1","2","3"].map(g => { const p = firstOf(g); return p && {grade:GR_LABEL[g], point:short(p.sent, 50)}; }).filter(Boolean);

  return {
    engine:"rules",
    career:{title: top.length >= 2 ? `${top.join(" · ")}` : (s.dept ? `${s.dept} 관련 (학생부 표현만으로는 좁히기 어렵습니다)` : "표현이 부족합니다"), field: s.dept || "",
      basis, fit:{level:"", note:"학생부에 자주 나온 표현을 센 결과입니다. 진로 판단은 선생님이 확인해 주세요."}, shift:""},
    narrative: ["1","2","3"].map(g => { const p = firstOf(g); return p && `${GR_LABEL[g]} ${short(p.sent, 45)}`; }).filter(Boolean).join(" → "),
    warnings:["AI 없이 학생부 문장에서 규칙으로 만든 질문지입니다. 근거 문장은 모두 원문 그대로지만, 진로와 답변 뼈대는 일반적인 틀입니다. 지뢰 항목도 용어처럼 보이는 표현만 골랐습니다. 더 정확한 질문지는 claude.ai 앱에서 만드세요."],
    mines, sections,
    closing:`${dept}에서 하고 싶은 공부 한 가지와, 학생부에서 가장 자신 있는 활동 하나를 묶어 한 문장으로 준비하세요.`,
  };
}

const gen = {};
function genBar(s){
  const g = gen[s.id] || {};
  const run = g.state === "run";
  return h("div",{class:"row",id:"gen-"+s.id},
    h("button",{class:"primary",disabled:run,text: run ? "만드는 중…" : "Claude로 만들기",onclick:()=>generateSheet(s)}),
    h("button",{disabled:run,text:"전체 분석 (학년별로 나눠서)",title:"학생부가 길어도 잘리지 않게 3학년·2학년·1학년을 따로 분석해 합칩니다. 시간과 사용량이 더 듭니다.",onclick:()=>generateSheetSplit(s)}),
    h("button",{text:"AI 없이 만들기",title:"학생부 문장에서 규칙으로 질문을 뽑습니다. 돈도 인터넷도 들지 않습니다.",onclick:()=>{
      const sheet = rulesSheet(s);
      if (!sheet){ gen[s.id] = {state:"err", msg:"학생부를 먼저 넣어 주세요."}; refreshGen(s); return; }
      s.sheet = sheet; s.example = false; s.check = [false,false,false,false];
      gen[s.id] = {state:"done", msg:"규칙으로 만들었습니다."};
      save(s); tab = "sheet"; render();
    }}),
    aiReady === false && !g.msg && h("span",{class:"status",text:"이 화면에서는 Claude가 안 될 수 있습니다. 눌러 보고 안 되면 ‘AI 없이 만들기’를 쓰세요."}),
    run && h("button",{text:"중단",onclick:()=>g.ctl?.abort()}),
    g.state === "done" && tab !== "sheet" && h("button",{text:"예상질문지 보기 →",onclick:()=>{ tab = "sheet"; render(); }}),
    h("span",{class:"status"+(g.state==="err"?" err":""),text:g.msg||""}));
}
const refreshGen = s => { const el = document.getElementById("gen-"+s.id); if (el) el.replaceWith(genBar(s)); };

async function generateSheet(s){
  const g = gen[s.id] = {state:"run", msg:"학생부를 읽는 중… (보통 30초~2분)"};
  const fail = msg => { g.state = "err"; g.msg = msg; refreshGen(s); };
  refreshGen(s);
  if (!recordText(s).trim()) return fail("학생부·정보 탭에서 학년별 세특·창체·행발을 먼저 넣어 주세요.");
  const sample = await window.claude?.use?.("sample");
  if (!sample){ aiReady = false; render(); return fail("이 화면에서는 Claude를 쓸 수 없습니다. claude.ai 앱 링크에서 열거나 ‘AI 없이 만들기’를 쓰세요."); }
  aiReady = true;
  g.ctl = new AbortController();
  try {
    const res = await sample.json(sheetPrompt(s), {
      signal: g.ctl.signal, cache:false,
      onText: ({text}) => { g.msg = `질문지 작성 중… ${text.length.toLocaleString()}자`; refreshGen(s); }
    });
    if (!res || !Array.isArray(res.sections)) throw {code:"invalid_json"};
    res.mines = (res.mines||[]).map(m => ({...m, ready:"미확인"}));
    s.sheet = res; s.example = false; s.check = [false,false,false,false];
    g.state = "done"; g.msg = "예상질문지가 준비됐습니다.";
    save(s); render();
  } catch(e){
    fail(({
      cancelled:"중단했습니다.", not_granted:"AI 사용이 허용되지 않았습니다.", rate_limited:"사용량 한도에 걸렸습니다. 잠시 후 다시 눌러 주세요.",
      invalid_json:"결과 형식이 깨졌습니다. 다시 눌러 주세요.", prompt_too_large:"학생부가 너무 깁니다. 1학년 기록을 줄이고 다시 시도하세요.",
      refused:"이 입력으로는 작성하지 못했습니다. 학생부 내용을 확인해 주세요."
    })[e?.code] || "연결이 끊겼습니다. 다시 눌러 주세요.");
  }
}

/* 학생부가 길면 한 번에 다 보낼 수 없다(한 번에 약 2만 자). 학년별로 나눠 부르고 합친다. */
const AREA_ORDER = ["지원동기·전공 적합성","학업 역량(세특 심화)","전공 관련 탐구·동아리","공동체 역량·협업"];
function finalPrompt(s, mines, byArea){
  return `고3 학생의 면접 예상질문지를 학년별로 나눠 만들었다. 아래 요약만 보고 마무리 부분을 쓴다.

- career: 이 학생의 진로를 한 줄로 딱 정한다. title(분야+역할, 20자 안팎), field(학문 분야), basis(학년별 근거 한 줄씩), fit({"level":"높음|보통|낮음","note":"한 줄"}), shift(진로가 바뀐 흔적이 있으면 한 줄, 없으면 "").
- narrative: 1학년→3학년 관심 심화 서사 1~2문장. 3학년에서 도달한 지점을 분명히 쓴다.
- closing: 마지막 한마디(1분) 뼈대. 진로와 이어지게.
- warnings: 면접 준비에서 주의할 점(블라인드 위험, 학년 간 진로 전환 설명 필요 등). 없으면 [].
JSON만 출력: {"career":{...},"narrative":"...","closing":"...","warnings":[]}

[지원] ${s.univ||""} ${s.dept||""} / ${s.track||""} / ${s.itype||""}
[지뢰 항목] ${mines.map(m => `${m.source} ${m.item}`).join(" / ") || "없음"}
[영역별 질문] ${byArea.map(([a,qs]) => `${a}: ${qs.map(q=>q.q).slice(0,6).join(" | ")}`).join("\n")}`;
}
async function generateSheetSplit(s){
  const g = gen[s.id] = {state:"run", msg:"학년별로 나눠 분석합니다…"};
  const fail = msg => { g.state = "err"; g.msg = msg; refreshGen(s); };
  refreshGen(s);
  const grades = ["3","2","1","0"].filter(x => hasGrade(s,x));
  if (!grades.length) return fail("학생부를 먼저 넣어 주세요.");
  const sample = await window.claude?.use?.("sample");
  if (!sample){ aiReady = false; render(); return fail("이 화면에서는 Claude를 쓸 수 없습니다. claude.ai 앱 링크에서 열거나 ‘AI 없이 만들기’를 쓰세요."); }
  aiReady = true;
  g.ctl = new AbortController();
  const total = grades.length + 1;
  try {
    const areas = new Map(), mines = [];
    let step = 0;
    for (const gr of grades){
      step++;
      const tick = extra => { g.msg = `${GR_LABEL[gr]} 기록 분석 중 (${step}/${total})${extra||""}`; refreshGen(s); };
      tick();
      const r = await sample.json(sheetPrompt(s, gr), {signal:g.ctl.signal, cache:false,
        onText:({text}) => tick(` · ${text.length.toLocaleString()}자`)});
      for (const m of r.mines||[]) mines.push({...m, ready:"미확인"});
      for (const sec of r.sections||[]) areas.set(sec.area, (areas.get(sec.area)||[]).concat(sec.questions||[]));
    }
    const byArea = [...areas].sort((a,b) => AREA_ORDER.indexOf(a[0]) - AREA_ORDER.indexOf(b[0]));
    g.msg = `진로와 서사를 정리하는 중 (${total}/${total})`; refreshGen(s);
    const fin = await sample.json(finalPrompt(s, mines, byArea), {signal:g.ctl.signal, cache:false});
    s.sheet = {engine:"claude-split", career:fin.career, narrative:fin.narrative, closing:fin.closing,
      warnings:(fin.warnings||[]).concat("학생부를 학년별로 나눠 분석해 합친 질문지입니다. 잘린 기록 없이 전부 반영했습니다."),
      mines, sections: byArea.map(([area,questions]) => ({area, questions}))};
    s.example = false; s.check = [false,false,false,false];
    g.state = "done"; g.msg = `전부 반영해 만들었습니다. 질문 ${byArea.reduce((n,x)=>n+x[1].length,0)}개.`;
    save(s); render();
  } catch(e){
    fail(e?.code === "cancelled" ? "중단했습니다." : e?.code === "rate_limited" ? "사용량 한도에 걸렸습니다. 잠시 후 다시 눌러 주세요."
      : e?.code === "invalid_json" ? "결과 형식이 깨졌습니다. 다시 눌러 주세요." : "연결이 끊겼습니다. 다시 눌러 주세요.");
  }
}

const srcGrade = src => (String(src||"").match(/([123])\s*학년/) || [])[1];
function srcTag(src){ return h("span",{class:"src"+(srcGrade(src)==="3"?" y3":""),text:src||""}); }

/* 근거 인용이 실제 학생부 원문에 있는지 대조한다. 띄어쓰기·문장부호는 무시. */
const normQ = t => String(t||"").replace(/[\s.,·…​"'"'`()[\]{}<>《》〈〉:：;!?~\-–—]/g,"");
const recordAll = s => ["1","2","3","0"].flatMap(g => REC.map(([k]) => recGet(s,g,k))).join("\n");
function checkQuote(hay, ev){
  const n = normQ(ev);
  if (n.length < 8) return "short";                                  // 너무 짧으면 판정하지 않는다
  if (hay.includes(n)) return "ok";
  if (n.length > 20 && (hay.includes(n.slice(0,20)) || hay.includes(n.slice(-20)))) return "part";
  return "miss";
}
const QUOTE_TAG = {part:["부분 일치","amber"], miss:["원문에 없음","red"]};
function quoteTag(state){
  const t = QUOTE_TAG[state];
  return t && h("span",{class:"chip "+t[1],style:"margin-left:6px",text:t[0]});
}

/* ───────── 한글·워드 파일(.docx)로 저장 ───────── */
const xmlEsc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const FONT = '<w:rFonts w:ascii="맑은 고딕" w:eastAsia="맑은 고딕" w:hAnsi="맑은 고딕"/>';
// sz는 half-point(22 = 11pt), ind는 왼쪽 들여쓰기(twip)
function P(text, o = {}){
  const rpr = FONT + (o.b ? "<w:b/>" : "") + `<w:sz w:val="${o.sz||22}"/><w:szCs w:val="${o.sz||22}"/>` + (o.color ? `<w:color w:val="${o.color}"/>` : "");
  const ppr = `<w:pPr><w:spacing w:before="${o.before||0}" w:after="${o.after||60}" w:line="288" w:lineRule="auto"/>`
    + (o.ind ? `<w:ind w:left="${o.ind}"/>` : "") + "</w:pPr>";
  const runs = String(text ?? "").split("\n").map((t,i) =>
    (i ? "<w:r><w:br/></w:r>" : "") + `<w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`).join("");
  return `<w:p>${ppr}${runs}</w:p>`;
}
function sheetDocx(s){
  const sh = s.sheet, c = sh.career, out = [];
  out.push(P(`${s.name||"학생"} — 면접 예상질문지`, {b:true, sz:34, after:40}));
  out.push(P(`${[s.univ,s.dept,s.track].filter(Boolean).join(" · ")} / 면접일 ${s.date||"미정"} / ${s.itype||""}`, {sz:18, color:"666666", after:180}));
  if (c){
    out.push(P("학생부로 본 진로", {b:true, sz:20, color:"1E6B57", after:20}));
    out.push(P(c.title||"", {b:true, sz:28, after:20}));
    out.push(P([c.field && "분야 "+c.field, c.fit?.level && `지원 학과 연결 ${c.fit.level}${c.fit.note ? " — "+c.fit.note : ""}`].filter(Boolean).join(" / "), {sz:19, color:"666666"}));
    for (const b of c.basis||[]) out.push(P(`· ${b.grade} ${b.point}`, {sz:19, ind:200}));
    if (c.shift) out.push(P("진로 변화 · "+c.shift, {sz:19, color:"666666"}));
  }
  out.push(P("한 줄 서사", {b:true, sz:24, before:220, after:40}));
  out.push(P(sh.narrative||"", {after:120}));
  out.push(P(`반드시 준비할 지뢰 항목 (${(sh.mines||[]).length}개)`, {b:true, sz:24, before:220, after:40}));
  for (const m of sh.mines||[]){
    out.push(P(`${m.item||""}  [${m.source||""}] 준비 수준: ${m.ready||"미확인"}`, {b:true, after:20}));
    out.push(P(`근거 “${m.evidence||""}”`, {sz:19, color:"666666", ind:200, after:20}));
    for (const q of m.questions||[]) out.push(P("– "+q, {ind:200}));
  }
  out.push(P("영역별 예상질문", {b:true, sz:24, before:220, after:40}));
  let n = 0;
  for (const sec of sh.sections||[]){
    out.push(P(`${sec.area} · ${(sec.questions||[]).length}문항`, {b:true, sz:20, color:"1E6B57", before:160, after:40}));
    for (const q of sec.questions||[]){
      n++;
      out.push(P(`Q${n}. ${q.q||""}`, {b:true, before:100, after:20}));
      out.push(P(`근거 “${q.evidence||""}” [${q.source||""}]`, {sz:19, color:"666666", ind:280, after:20}));
      out.push(P(`키워드 ${(q.keywords||[]).join(" / ")}`, {sz:19, ind:280, after:20}));
      out.push(P(`뼈대 ${q.skeleton||""}`, {sz:19, ind:280, after:20}));
      for (const t of q.tails||[]) out.push(P("꼬리질문 "+t, {sz:19, ind:280, after:20}));
    }
  }
  out.push(P("마지막 한마디 (1분)", {b:true, sz:24, before:220, after:40}));
  out.push(P(sh.closing||"", {after:120}));
  out.push(P("담임 체크리스트", {b:true, sz:24, before:220, after:40}));
  for (const t of ["지뢰 항목 개념을 설명할 수 있다","블라인드 위반 표현이 없다","답변이 60초를 넘지 않는다","모든 답변이 학생부 근거를 갖는다"]) out.push(P("□ "+t));
  out.push(P("완성 답변은 일부러 넣지 않았습니다. 학생이 키워드와 뼈대로 직접 말하게 해 주세요.", {sz:18, color:"666666", before:160}));
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${out.join("")}
<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;
}
async function exportDocx(s, status){
  const set = (t, err) => { status.className = "status" + (err ? " err" : ""); status.textContent = t; };
  const dl = await window.claude?.use?.("downloads");

  set("파일을 만드는 중…");
  try {
    await loadScript(CDN+"jszip/3.10.1/jszip.min.js");
    const zip = new JSZip();
    zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
    zip.folder("_rels").file(".rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
    zip.folder("word").file("document.xml", sheetDocx(s));
    const blob = await zip.generateAsync({type:"blob"});
    await dl.save({filename:`${(s.name||"학생").replace(/[\\/:*?"<>|]/g,"")}_면접예상질문지.docx`, data: blob});

  }
}

    h("div",{class:"checks"}, ["지뢰 항목 개념을 설명할 수 있다","블라인드 위반 표현이 없다","답변이 60초를 넘지 않는다","모든 답변이 학생부 근거를 갖는다"].map((t,i)=>
      h("label",null, h("input",{type:"checkbox",id:"ck"+i,checked:!!(s.check||[])[i],onchange:e=>{(s.check ||= [false,false,false,false])[i]=e.target.checked; save(s);}}), t))),
    h("p",{class:"hint",text:"완성 답변은 일부러 쓰지 않았습니다. 외운 티가 나는 답은 감점 요인이라, 학생이 키워드와 뼈대로 직접 말하게 해 주세요. 모르는 개념은 모른다고 답하고 배우고 싶다는 태도를 보이는 편이 낫습니다."})
  );
}

/* ───────── 모의면접 ───────── */
let mockCtl = null, askedAt = null;
function mockRules(s){
  const sh = s.sheet ? JSON.stringify({career:s.sheet.career?.title, narrative:s.sheet.narrative, mines:s.sheet.mines?.map(m=>m.item)}) : "(질문지 없음)";
  return `너는 ${s.univ||"지원 대학"} ${s.dept||""} ${s.track||""} 면접관이다. 면접 유형: ${s.itype||"서류 기반 확인 면접"}.
아래 학생부를 근거로 질문한다. 상대는 고3 학생이다.

진행 규칙
1. 한 번에 질문 하나만 한다. 처음에는 짧은 인사 한 줄 뒤 첫 질문.
2. 학생이 답하면 그 답변을 파고드는 꼬리질문 1개를 던진다(구체화·검증·실패·확장 중). 꼬리질문에 답하면 다음 새 질문으로 넘어간다.
3. 새 질문 3개(각각의 꼬리질문 포함)가 끝날 때마다 면접관 역할을 잠시 멈추고 "[피드백]"으로 시작하는 블록을 쓴다: 잘한 점 1개(학생 답변을 구체적으로 인용), 고칠 점 1개(반드시 대안 함께), 블라인드 위반 여부(출신 고교명·지역·부모 직업·교외 수상·어학 성적·논문·해외 활동·자격증 언급). "좋았습니다" 같은 막연한 말은 쓰지 않는다. 학생이 위축되지 않게 쓴다. 그다음 줄에 다음 질문을 이어간다.
4. 학생부에 없는 활동을 전제로 질문하지 않는다. 3학년 → 2학년 기록을 우선 묻고(1학년은 계기 확인 정도), 지뢰 항목(고교 수준을 넘는 개념, 과정이 빠진 탐구)을 파고든다.
5. 학생이 모른다고 하면 다그치지 말고 넘어가되, 피드백에서 "모르면 모른다고 답하고 배우고 싶다는 태도"가 낫다는 원칙을 짚는다.
6. 면접관 말은 실제 면접처럼 정중하고 간결하게, 3문장 이내(피드백 블록 제외). 답변을 대신 써 주지 않는다.

[지뢰·서사 요약] ${sh}

[학생부]
${recordText(s, 14000)}`;
}

async function sendMock(s, text, ui){
  const sample = await window.claude?.use?.("sample");
  if (!sample){ ui.status.className="status err"; ui.status.textContent="이 화면에서는 AI 기능을 쓸 수 없습니다. claude.ai에서 열어 주세요."; return; }
  s.chat ||= [];
  if (text){
    const secs = askedAt ? Math.round((Date.now()-askedAt)/1000) : null;
    s.chat.push({role:"user", content:text, secs, flags:blindCheck(text).map(f=>f.label+" ‘"+f.match+"’")});
  }
  save(s); render();
  const turns = [{role:"user", content:mockRules(s)}, ...s.chat.slice(-40).map(m=>({role:m.role, content:m.content}))];
  if (turns.length === 1) turns.push({role:"user", content:"면접을 시작해 주세요."});
  mockCtl = new AbortController();
  const live = h("div",{class:"msg them",text:"…"});
  $("#chat").append(live); $("#chat").scrollTop = 1e9;
  $("#m-send").disabled = true; $("#m-stop").hidden = false;
  try {
    const {text:reply} = await sample(turns, {cache:false, signal:mockCtl.signal, onText:({text})=>{ live.textContent = text; $("#chat").scrollTop = 1e9; }});
    s.chat.push({role:"assistant", content:reply});
    askedAt = Date.now();
    save(s);
  } catch(e){
    if (e?.text) s.chat.push({role:"assistant", content:e.text + " (중단됨)"});
    const st = $("#m-status");
    render();
    if (e?.code !== "cancelled") { const el = $("#m-status"); if (el){ el.className="status err"; el.textContent = e?.code==="rate_limited" ? "사용량 한도에 걸렸습니다. 잠시 후 다시 보내 주세요." : e?.code==="not_granted" ? "AI 사용이 허용되지 않았습니다." : "연결이 끊겼습니다. 다시 보내 주세요."; } }
    return;
  }
  render();
}

/* ───────── 연습 모드: AI 없이 도는 모의면접 ─────────
   질문지의 질문을 하나씩 던지고, 답변을 규칙으로 점검한다(길이·시간·근거·군말·블라인드). */
const FILLER = /(음{2,}|어{2,}|그냥|약간|뭐랄까|좀)/g;
const practiceQs = s => (s.sheet?.sections||[]).flatMap(sec => (sec.questions||[]).map(q => ({...q, area:sec.area})));
function answerNotes(q, text, secs){
  const n = [], len = text.trim().length;
  if (len < 80) n.push(["warn", `${len}자로 짧습니다. 결론 → 근거 활동 → 배운 점 순서로 150자 안팎을 채워 보세요.`]);
  else if (len > 320) n.push(["warn", `${len}자로 깁니다. 말하면 60초를 넘기니 근거 활동을 하나만 남기세요.`]);
  else n.push(["ok", `${len}자, 말하면 40~60초로 알맞습니다.`]);
  if (secs != null && secs > 90) n.push(["warn", `답변을 시작하기까지 ${secs}초 걸렸습니다. 실제 면접에서는 생각할 시간이 짧습니다.`]);
  const hit = (q.keywords||[]).filter(k => k && text.includes(k));
  if (hit.length) n.push(["ok", `학생부 활동(${hit.join(", ")})을 근거로 댔습니다.`]);
  else n.push(["warn", `학생부 근거가 보이지 않습니다. ${(q.keywords||[]).filter(Boolean).slice(0,2).join(", ") || "해당 활동"}을(를) 직접 말하세요.`]);
  const first = text.trim().split(/(?<=[.!?])\s/)[0] || "";
  if (first.length > 70) n.push(["warn", "첫 문장이 깁니다. 결론을 한 문장으로 먼저 말하고 근거를 뒤에 붙이세요."]);
  const f = (text.match(FILLER)||[]).length;
  if (f >= 3) n.push(["warn", `군말이 ${f}번 나옵니다. 빼고 다시 말해 보세요.`]);
  for (const b of blindCheck(text)) n.push(["blind", `블라인드 위반 — ${b.label} ‘${b.match}’`]);
  return n;
}
function viewPractice(s){
  const qs = practiceQs(s);
  if (!qs.length) return h("div",{class:"note",text:"연습 모드는 예상질문지의 질문을 씁니다. 질문지 탭에서 먼저 만들어 주세요. 'AI 없이 만들기'로도 됩니다."});
  const p = s.practice ||= {i:0, stage:"q", log:[]};
  if (p.i >= qs.length) return h("div",{style:"display:grid;gap:12px"},
    h("div",{class:"note",text:`질문 ${qs.length}개를 모두 마쳤습니다.`}),
    practiceSummary(s, qs),
    h("button",{class:"primary",text:"처음부터 다시",onclick:()=>{ s.practice = {i:0, stage:"q", log:[]}; save(s); render(); }}));

  const q = qs[p.i], rec = p.log[p.i];
  askedAt ||= Date.now();
  const box = h("textarea",{id:"p-input",rows:4,placeholder:"학생이 말한 답을 적거나, 학생이 직접 입력하게 하세요."});
  const cnt = h("span",{class:"muted",text:"0자"});
  const flags = h("div",{class:"flags"});
  box.oninput = () => {
    cnt.textContent = box.value.length + "자";
    flags.replaceChildren(...blindCheck(box.value).map(f => h("span",{class:"chip red",text:"블라인드: "+f.label+" ‘"+f.match+"’"})));
  };
  const submit = () => {
    const t = box.value.trim(); if (!t) return;
    const secs = askedAt ? Math.round((Date.now()-askedAt)/1000) : null;
    p.log[p.i] = {q:q.q, a:t, secs, notes:answerNotes(q, t, secs)};
    p.stage = "feedback"; askedAt = null; save(s); render();
  };
  const next = () => { p.i++; p.stage = "q"; askedAt = Date.now(); save(s); render(); };
  clearInterval(viewMock._t);
  if (p.stage === "q") viewMock._t = setInterval(() => {
    const el = $("#m-timer"); if (!el){ clearInterval(viewMock._t); return; }
    const sec = Math.round((Date.now() - askedAt)/1000);
    el.textContent = `${sec}초`; el.classList.toggle("over", sec > 60);
  }, 1000);

  return h("div",{style:"display:grid;gap:12px"},
    h("div",{class:"row"},
      h("span",{class:"label",text:`${q.area} · ${p.i+1} / ${qs.length}`}),
      h("span",{class:"spacer"}),
      h("span",{class:"timer",id:"m-timer"})),
    h("div",{class:"msg them",style:"max-width:none"}, q.q,
      h("div",{class:"meta"}, h("q",{class:"quote",text:q.evidence||""}), srcTag(q.source))),

    p.stage === "feedback" && rec ? [
      h("div",{class:"msg me",style:"max-width:none"}, rec.a, h("div",{class:"meta",text:`${rec.a.length}자 · ${rec.secs ?? "-"}초`}),
      ),
      h("div",{class:"msg fb",style:"max-width:none"},
        h("div",{class:"label",text:"점검"}),
        h("ul",{style:"margin:6px 0 0;padding-left:18px"}, rec.notes.map(([t,m]) =>
          h("li",null, h("span",{class:"chip "+(t==="ok"?"green":t==="blind"?"red":"amber"),text:t==="ok"?"좋음":t==="blind"?"위반":"고칠 점"}), " ", m))),
        (q.tails||[]).length ? h("p",{style:"margin:10px 0 0"}, h("b",null,"꼬리질문 · "), q.tails[0]) : null),
      h("div",{class:"row"},
        h("button",{class:"primary",text: p.i+1 < qs.length ? "다음 질문 →" : "마치기",onclick:next}),
        h("button",{text:"이 질문 다시",onclick:()=>{ p.stage="q"; p.log[p.i]=null; askedAt=Date.now(); save(s); render(); }}))
    ] : [
      h("label",{class:"f",for:"p-input"},"답변", box), flags,
      h("div",{class:"row"}, h("button",{class:"primary",text:"답변 제출",onclick:submit}),
        h("button",{text:"이 질문 건너뛰기",onclick:next}), h("span",{class:"spacer"}), cnt)
    ],
    h("p",{class:"hint",text:"AI 없이 도는 연습 모드입니다. 답변 길이, 걸린 시간, 학생부 근거를 댔는지, 군말, 블라인드 위반을 규칙으로 점검합니다."})
  );
}
function practiceSummary(s, qs){
  const done = (s.practice?.log||[]).filter(Boolean);
  if (!done.length) return null;
  const avg = Math.round(done.reduce((n,x)=>n+x.a.length,0)/done.length);
  const blind = done.reduce((n,x)=>n+x.notes.filter(([t])=>t==="blind").length,0);
  const weak = done.reduce((n,x)=>n+x.notes.filter(([t,m])=>t==="warn" && m.includes("근거")).length,0);
  return h("div",{class:"note"},
    h("div",{class:"label",text:"연습 결과"}),
    h("ul",{style:"margin:6px 0 0;padding-left:18px"},
      h("li",{text:`답변 ${done.length}개, 평균 ${avg}자`}),
      h("li",{text:`학생부 근거가 빠진 답변 ${weak}개`}),
      h("li",{text:`블라인드 위반 ${blind}건`})));
}

function viewMock(s){
  const mode = s.mockMode || (aiReady ? "ai" : "rule");
  const tabsRow = h("div",{class:"row",style:"margin-bottom:4px"},
    h("button",{class: mode==="ai" ? "primary" : "", text:"Claude 면접관",onclick:()=>{ s.mockMode="ai"; save(s); render(); }}),
    h("button",{class: mode==="rule" ? "primary" : "", text:"연습 모드 (AI 없음)",onclick:()=>{ s.mockMode="rule"; askedAt=Date.now(); save(s); render(); }}),
    aiReady === false && h("span",{class:"muted",text:"Claude 면접관은 claude.ai 앱 링크에서만 됩니다."}));
  if (mode === "rule") return h("div",{style:"display:grid;gap:12px"}, tabsRow, viewPractice(s));
  return h("div",{style:"display:grid;gap:12px"}, tabsRow, viewMockAI(s));
}
function viewMockAI(s){
  const chat = s.chat || [];
  const status = h("span",{class:"status",id:"m-status"});
  const timer = h("span",{class:"timer",id:"m-timer"});
  const box = h("textarea",{id:"m-input",rows:3,placeholder:"학생 답변을 입력하세요 (말로 30~60초, 글로 약 150~200자)"});
  const count = h("span",{class:"muted",text:"0자"});
  const live = h("div",{class:"flags"});
  box.oninput = () => {
    count.textContent = box.value.length + "자";
    live.replaceChildren(...blindCheck(box.value).map(f=>h("span",{class:"chip red",text:"블라인드: "+f.label+" ‘"+f.match+"’"})));
  };
  const send = h("button",{class:"primary",id:"m-send",text: chat.length ? "답변 보내기" : "면접 시작"});
  send.onclick = () => {
    const t = box.value.trim();
    if (chat.length && !t) return;
    sendMock(s, chat.length ? t : "", {status});
  };
  box.onkeydown = e => { if (e.key==="Enter" && (e.ctrlKey||e.metaKey)) send.click(); };
  const stop = h("button",{id:"m-stop",text:"중단",hidden:true,onclick:()=>mockCtl?.abort()});
  let armed = false;
  const reset = h("button",{text:"처음부터",onclick:()=>{
    if (!armed){ armed = true; reset.textContent = "기록 지우기 확인"; return; }
    s.chat = []; askedAt = null; save(s); render();
  }});

  const msgs = chat.map(m => {
    if (m.role === "assistant"){
      const fb = m.content.includes("[피드백]");
      return h("div",{class:"msg "+(fb?"fb":"them"),text:m.content});
    }
    const over = m.secs != null && m.secs > 60;
    return h("div",{class:"msg me"}, m.content,
      h("div",{class:"meta"}, `${m.content.length}자`, m.secs!=null ? ` · 답변 ${m.secs}초${over?" (60초 초과)":""}` : ""),
      (m.flags||[]).length ? h("div",{class:"flags"}, m.flags.map(f=>h("span",{class:"chip red",text:"블라인드: "+f}))) : null);
  });

  clearInterval(viewMock._t);
  if (chat.length && chat.at(-1).role === "assistant" && askedAt){
    viewMock._t = setInterval(() => {
      const el = $("#m-timer"); if (!el){ clearInterval(viewMock._t); return; }
      const sec = Math.round((Date.now()-askedAt)/1000);
      el.textContent = `답변 시간 ${sec}초`; el.classList.toggle("over", sec > 60);
    }, 1000);
  }

  return h("div",{style:"display:grid;gap:12px"},
    !s.sheet && h("div",{class:"note",text:"예상질문지를 먼저 만들면 면접관이 지뢰 항목을 우선 파고듭니다. 질문지 없이도 학생부만으로 진행할 수 있습니다."}),
    h("div",{class:"chat",id:"chat"}, msgs.length ? msgs : h("div",{class:"empty",text:"면접관이 한 번에 한 문항씩 묻고, 답하면 꼬리질문을 던집니다. 새 질문 3개마다 잘한 점·고칠 점·블라인드 위반 여부를 피드백합니다."})),
    h("label",{class:"f",for:"m-input"},"답변", box),
    live,
    h("div",{class:"row"}, send, stop, status, h("span",{class:"spacer"}), timer, count, reset),
    h("p",{class:"hint",text:"Ctrl+Enter로 보내기. 학생이 직접 입력하거나, 말로 한 답을 선생님이 받아 적어도 됩니다."})
  );
}

/* ───────── 블라인드 점검 ───────── */
function viewBlind(s){
  const box = h("textarea",{id:"b-input",rows:9,value:s.blindDraft||"",placeholder:"학생의 답변 원고나 자기소개를 붙여 넣으세요."});
  const out = h("div",{class:"result"});
  const run = () => {
    const t = box.value, f = blindCheck(t);
    s.blindDraft = t; save(s);
    if (!t.trim()){ out.replaceChildren(h("p",{class:"muted",text:"붙여 넣으면 바로 검사합니다."})); return; }
    if (!f.length){ out.replaceChildren(h("span",{class:"chip green",text:"자동 검사에서 걸린 표현 없음"}), h("p",{class:"hint",text:"자동 검사는 정해진 패턴만 찾습니다. 학교를 짐작할 수 있는 고유 행사명·지명은 직접 한 번 더 읽어 주세요."})); return; }
    const frag = [], last = {i:0};
    f.forEach(x => { if (x.index < last.i) return; frag.push(t.slice(last.i, x.index), h("mark",{text:x.match,title:x.label})); last.i = x.index + x.match.length; });
    frag.push(t.slice(last.i));
    out.replaceChildren(
      h("span",{class:"chip red",text:`${f.length}곳 확인 필요`}),
      h("div",{class:"note",style:"white-space:pre-wrap;margin-top:10px"}, frag),
      h("ul",{style:"padding-left:18px"}, f.map(x=>h("li",null, h("b",{text:x.label}), " — ", x.match))));
  };
  box.oninput = run; run();
  return h("div",{style:"display:grid;gap:12px"},
    h("label",{class:"f",for:"b-input"},"점검할 답변", box), out,
    h("div",{class:"note"}, h("div",{class:"label",style:"margin-bottom:4px",text:"면접에서 말하면 안 되는 것"}),
      h("ul",{style:"margin:0;padding-left:18px"},
        ["출신 고등학교명, 지역을 특정하는 표현 (“저희 ○○고에서는”)","부모·친인척의 직업, 사회·경제적 지위","교외 수상, 공인 어학 성적, 논문·학회 실적, 해외 활동, 자격증(일부 제외)","독서활동 상황의 도서명 (세특 본문에 녹아 있는 독서 내용은 가능)","학생부에 없는 활동"].map(t=>h("li",{text:t}))))
  );
}
